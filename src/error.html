<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="/favicon.png" />
		<title>Error %sveltekit.status% | date-fns format helper</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				background: #f7f5ef;
				color: #1c2528;
				font-family: 'InterVariable', 'Inter', ui-sans-serif, system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			::selection {
				background: #b7ead8;
				color: #102f2b;
			}
			header {
				background: #102f2b;
				color: #f7f5ef;
			}
			.wrap {
				max-width: 80rem;
				margin: 0 auto;
				padding: 1.25rem;
			}
			header a {
				color: inherit;
				font-weight: 600;
				letter-spacing: -0.01em;
				text-decoration: none;
			}
			main {
				flex: 1;
				display: grid;
				align-items: center;
			}
			.panel {
				max-width: 36rem;
				border-left: 4px solid #059669;
				background: #e7efe9;
				padding: 2rem;
			}
			.status {
				margin: 0;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.875rem;
				line-height: 1.5rem;
				color: #065f46;
			}
			h1 {
				margin: 0.75rem 0 0;
				font-size: 2.25rem;
				line-height: 1.1;
				font-weight: 600;
				letter-spacing: -0.025em;
				text-wrap: balance;
			}
			p.lede {
				margin: 1rem 0 0;
				max-width: 52ch;
				font-size: 1rem;
				line-height: 1.75rem;
				color: #526064;
			}
			.actions {
				margin-top: 1.5rem;
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
			}
			.btn {
				display: inline-flex;
				align-items: center;
				border-radius: 0.375rem;
				padding: 0.5rem 0.875rem;
				font: inherit;
				font-size: 0.9375rem;
				font-weight: 500;
				line-height: 1.5rem;
				text-decoration: none;
				cursor: pointer;
			}
			.btn-primary {
				border: 1px solid #047857;
				background: #047857;
				color: #fff;
			}
			.btn-primary:hover {
				background: #065f46;
			}
			.btn-secondary {
				border: 1px solid rgb(6 95 70 / 0.25);
				background: transparent;
				color: #065f46;
			}
			.btn-secondary:hover {
				background: rgb(255 255 255 / 0.6);
			}
			.btn:focus-visible {
				outline: 2px solid #047857;
				outline-offset: 2px;
			}
			@media (min-width: 640px) {
				.wrap {
					padding: 1.25rem 2rem;
				}
				h1 {
					font-size: 3rem;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div class="wrap"><a href="/">date-fns / format</a></div>
		</header>
		<main>
			<div class="wrap">
				<div class="panel">
					<p class="status">Error %sveltekit.status%</p>
					<h1>Something went wrong</h1>
					<p class="lede">
						We hit an unexpected problem loading this page. Give it another try in a moment.
					</p>
					<div class="actions">
						<button type="button" class="btn btn-primary" onclick="location.reload()">
							Try again
						</button>
						<a class="btn btn-secondary" href="/">Back to home</a>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
